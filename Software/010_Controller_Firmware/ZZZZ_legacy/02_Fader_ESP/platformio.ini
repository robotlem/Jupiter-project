; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[env:esp32-s3-devkitc-1]
;platform = espressif32
;board = esp32-s3-devkitc-1
;framework = arduino

[env:esp32-s3-devkitc-1-n32r16v]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Flash-Konfiguration (32 MB Octal Flash)
board_upload.flash_size = 32MB
board_build.flash_mode = opi
board_build.flash_freq = 80m

; PSRAM-Konfiguration (16 MB Octal PSRAM)
board_build.arduino.memory_type = opi_opi
board_build.psram_type = opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1  ; Aktiviert USB-Seriell über den internen USB-Port

; Partitionstabelle für 32 MB Flash (muss ggf. manuell erstellt werden oder Standard nutzen)
;board_build.partitions = default_32MB.csv

monitor_speed = 115200

